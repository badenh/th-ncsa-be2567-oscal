profile:
  uuid: 9aa80d7a-8860-555a-ad50-b78f7e1040aa
  metadata:
    title: Cybersecurity Standards for Cloud Systems — High Impact, Cloud Service Provider
    published: '2024-09-10T00:00:00+07:00'
    last-modified: '2025-09-01T00:00:00+07:00'
    version: '1.1'
    oscal-version: 1.2.3
    props:
    - name: profile-axis
      value: impact-level x party
    - name: impact-level
      value: high
    - name: party
      value: csp
    - name: party-title
      value: Cloud Service Provider
    - name: source-clause
      value: '4'
    - name: certification
      value: Certified by a certify body on a 3-year cycle. This includes a full certification in the
        1st year and a surveillance audit in the 2nd and 3rd years. Additionally, it must also be certified
        to either ISO/IEC 27017 or CSA STAR Level 2/CCM, and ISO/IEC 27018 and ISO/IEC 27701.
    links:
    - href: https://cloudsecurity.ncsa.or.th/publicationdocuments.html
      rel: canonical
    remarks: 'High Impact baseline for a Cloud Service Provider (CSP), from the minimum-requirements matrix
      in clause 4 of the annex.


      Selects 37 of the catalog''s 37 cloud service provider controls, of which 10 are added at this level
      (5.2.5, 5.2.6) over the moderate-impact profile.


      Minimum requirements as the matrix states them: Part One: - All Part Two: - All


      Certification required of the cloud service provider at this level: Certified by a certify body
      on a 3-year cycle. This includes a full certification in the 1st year and a surveillance audit in
      the 2nd and 3rd years. Additionally, it must also be certified to either ISO/IEC 27017 or CSA STAR
      Level 2/CCM, and ISO/IEC 27018 and ISO/IEC 27701.


      This profile is a rendering of a published standard and carries no roles or parties: the National
      Cyber Security Committee issued the standard, not this file.'
