profile:
  uuid: 0095dda6-2374-5ae4-8a7a-83ae5b99f94a
  metadata:
    title: Cybersecurity Standards for Cloud Systems — Moderate Impact, Cloud Service Provider
    published: '2024-09-10T00:00:00+07:00'
    last-modified: '2025-09-01T00:00:00+07:00'
    version: '1.1'
    oscal-version: 1.2.3
    props:
    - name: profile-axis
      value: impact-level x party
    - name: impact-level
      value: moderate
    - name: party
      value: csp
    - name: party-title
      value: Cloud Service Provider
    - name: source-clause
      value: '4'
    - name: certification
      value: Certified by a certify body on a 3-year cycle. This includes a full certification in the
        1st year and a surveillance audit in the 2nd and 3rd years. Additionally, it must also be certified
        at least to CSA STAR Level 2/CCM and ISO/IEC 27701.
    links:
    - href: https://cloudsecurity.ncsa.or.th/publicationdocuments.html
      rel: canonical
    remarks: 'Moderate Impact baseline for a Cloud Service Provider (CSP), from the minimum-requirements
      matrix in clause 4 of the annex.


      Selects 27 of the catalog''s 37 cloud service provider controls, of which 9 are added at this level
      (5.1.3, 5.2.7, 5.2.10) over the low-impact profile.


      Minimum requirements as the matrix states them: Part One: - All Part Two: - 5.2.1, 5.2.2, 5.2.3,
      5.2.4, 5.2.7, 5.2.8, 5.2.9, and 5.2.10 *Without 5.2.5


      Certification required of the cloud service provider at this level: Certified by a certify body
      on a 3-year cycle. This includes a full certification in the 1st year and a surveillance audit in
      the 2nd and 3rd years. Additionally, it must also be certified at least to CSA STAR Level 2/CCM
      and ISO/IEC 27701.


      This profile is a rendering of a published standard and carries no roles or parties: the National
      Cyber Security Committee issued the standard, not this file.'
