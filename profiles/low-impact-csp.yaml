    title: Cybersecurity Standards for Cloud Systems — Low Impact, Cloud Service Provider
    published: '2024-09-10T00:00:00+07:00'
    last-modified: '2025-09-01T00:00:00+07:00'
    version: '1.1'
    oscal-version: 1.2.3
    props:
    - name: profile-axis
      value: impact-level x party
    - name: impact-level
      value: low
    - name: party
      value: csp
    - name: party-title
      value: Cloud Service Provider
    - name: source-clause
      value: '4'
    - name: certification
      value: Certified by certify bodies on a 3-year cycle, consisting of certification the 1st year and
        surveillance audits in the 2nd and 3rd years, certification must also be certified to at least
        ISO/IEC 27001 and CSA STAR Level 1/CCM Lite.
    links:
    - href: https://cloudsecurity.ncsa.or.th/publicationdocuments.html
      rel: canonical
    remarks: 'Low Impact baseline for a Cloud Service Provider (CSP), from the minimum-requirements matrix
      in clause 4 of the annex.


      Selects 18 of the catalog''s 37 cloud service provider controls.


      Minimum requirements as the matrix states them: Part One: - 5.1.1 and 5.1.2 Part Two: - 5.2.1, 5.2.2,
      5.2.3, 5.2.4, 5.2.8, and 5.2.9 *Without 5.2.5


      Certification required of the cloud service provider at this level: Certified by certify bodies
      on a 3-year cycle, consisting of certification the 1st year and surveillance audits in the 2nd and
      3rd years, certification must also be certified to at least ISO/IEC 27001 and CSA STAR Level 1/CCM
      Lite.


      This profile is a rendering of a published standard and carries no roles or parties: the National
      Cyber Security Committee issued the standard, not this file.'
