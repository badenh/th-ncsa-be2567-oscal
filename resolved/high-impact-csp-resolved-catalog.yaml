    remarks: 'Resolved profile catalog: the CSCS catalog reduced to the 37 controls the `high-impact-csp`
      profile chain selects. Section groups left with no controls are removed; the front-matter groups
      and the back-matter are kept whole.


      Generated from the NCSA''s published PDF by `pdf_to_catalog.py`. The framework content is the National
      Cyber Security Committee''s; the OSCAL rendering is not theirs and they have not reviewed it, which
      is why the parties above describe the source document and no party is named as an author of this
      catalog.


      The source is an unofficial English translation. Clause 5 was retranslated between version 1.0 and
      version 1.1 — same 41 clauses and the same clause 4 matrix, substantially different English — so
      `metadata.version` is the *translation* version, not a version of the standard.


      Each clause of the standard is two controls, one per party column, suffixed `-csc` and `-csp`. Six
      clauses address one party only and mint one control. Sections carry `props[name=minimum-impact-level]`,
      the weakest impact level at which the clause 4 matrix requires them.'
    revisions:
    - version: '1.0'
      remarks: 'Oct 2024: Initial version'
    - version: '1.1'
      remarks: 'Sep 2025: Updated contents in section 5. Standards for Cybersecurity of Cloud Systems'
  groups:
  - id: th-cscs-notification
    class: front-matter
    title: The Notification
    props:
    - name: sort-id
      value: '00'
    parts:
    - id: th-cscs-notification.clause-1
      name: provision
      title: Clause 1
      props:
      - name: label
        value: Clause 1
      prose: 'This notification shall be called the Notification of the National Cyber Security Committee
        Re: Cybersecurity Standards for Cloud Systems, B.E. 2567 (2024)."'
    - id: th-cscs-notification.clause-2
      name: provision
      title: Clause 2
      props:
      - name: label
        value: Clause 2
      prose: This notification shall come into force two years after its publication in the Royal Thai
        Government Gazette.
    - id: th-cscs-notification.clause-3
      name: provision
      title: Clause 3
      props:
      - name: label
        value: Clause 3
      prose: 'In this notification: "Agency" refers to government agencies, regulators, and organizations
        of critical information infrastructure as defined by the Cybersecurity Act, B.E. 2562 (2019).
        "Cloud Computing" refers to the concept of accessing information networks consisting of shareable,
        elastic, and scalable physical or virtual resources through self-service provisioning and on-demand
        administration. "Cloud Service" refers to the capability to perform cloud computing, which is
        accessible via a designated interface. "Cloud Service Category" refers to a group of cloud services
        with certain shared characteristics, categorized as follows: (1) Infrastructure as a Service (IaaS):
        Comprising computing systems, data storage, networks, and other relevant resources, where users
        can efficiently use software on provided infrastructure without managing the underlying infrastructure.
        (2) Platform as a Service (PaaS): Comprising application platforms, databases, and computer services,
        where users can develop, deploy, and configure software without managing the underlying infrastructure.
        (3) Software as a Service (SaaS): Where providers offer ready-to-use software, and users manage
        configurations, parameters, processing units, and storage to achieve their service objectives.
        (4) Any combination of services from (1) to (3). (5) Other services as notified by the Office.
        "Public Cloud" refers to cloud services accessible by any cloud service user, with resources controlled
        by the cloud service provider. "Cloud Service Customer" (CSC) refers to an agency with a formal
        contract to use cloud services provided by a cloud service provider. "Cloud Service Provider"
        (CSP) refers to a public or private entity that makes cloud services available to customers, managing
        resources to ensure availability, security, and scalability for its users. "Personal Data" refers
        to personal data as defined in Section 6 of the Personal Data Protection Act, B.E. 2562 (2019).
        "Office" refers to the Office of the National Cyber Security Agency.'
    - id: th-cscs-notification.clause-4
      name: provision
      title: Clause 4
      props:
      - name: label
        value: Clause 4
      prose: 'Agencies using public cloud services must comply with this standard, taking into account
        the impact level of data or information systems as specified in the Notification of the National
        Cyber Security Committee Re: Standards for Cybersecurity Categorization of Data or Information
        Systems, B.E. 2566 (2023), and must meet at least the minimum requirements set out at the end
        of this notification.'
    - id: th-cscs-notification.clause-5
      name: provision
      title: Clause 5
      props:
      - name: label
        value: Clause 5
      prose: 'For personal data, the impact level for confidentiality must be classified at least as medium,
        as specified in the Notification of the National Cyber Security Committee Re: Standards for Cybersecurity
        Categorization of Data or Information Systems, B.E. 2566 (2023), and must meet at least the minimum
        requirements set out at the end of this notification.'
    - id: th-cscs-notification.clause-6
      name: provision
      title: Clause 6
      props:
      - name: label
        value: Clause 6
      prose: Agencies must submit a summary report of the actions taken to the Office within 30 days of
        completion.
    - id: th-cscs-notification.clause-7
      name: provision
      title: Clause 7
      props:
      - name: label
        value: Clause 7
      prose: The Secretary-General of the National Cyber Security Committee is responsible for enforcing
        this notification and is authorized to issue notifications, orders, criteria, and procedures to
        comply with this notification. In case of any issues related to compliance with this notification
        or matters not specified herein, the Chairman of the National Cyber Security Committee shall have
        the authority to interpret and adjudicate, and such interpretation and decision shall be final.
        Given on 10 September B.E. 2567 (2024) Phumtham Wechayachai Deputy Prime Minister as Chairman
        of the National Cyber Security Committee
