  - id: th-cscs-certification
    class: front-matter
    title: Minimum Requirements and Certification
    props:
    - name: sort-id
      value: '02'
    - name: source-clause
      value: '4'
    parts:
    - id: th-cscs-certification.low.minimum-requirements
      name: minimum-requirements
      title: Low Impact — minimum requirements
      props:
      - name: impact-level
        value: low
      prose: 'Part One: - 5.1.1 and 5.1.2 Part Two: - 5.2.1, 5.2.2, 5.2.3, 5.2.4, 5.2.8, and 5.2.9 *Without
        5.2.5'
    - id: th-cscs-certification.low.csc
      name: certification
      title: Low Impact — Cloud Service Customer
      props:
      - name: impact-level
        value: low
      - name: party
        value: csc
      prose: Self-assessment along with supporting documentation and approval from the highest executive
        of the organization, the assessment must be retained by the organization and submitted to the
        office
    - id: th-cscs-certification.low.csp
      name: certification
      title: Low Impact — Cloud Service Provider
      props:
      - name: impact-level
        value: low
      - name: party
        value: csp
      prose: Certified by certify bodies on a 3-year cycle, consisting of certification the 1st year and
        surveillance audits in the 2nd and 3rd years, certification must also be certified to at least
        ISO/IEC 27001 and CSA STAR Level 1/CCM Lite.
    - id: th-cscs-certification.moderate.minimum-requirements
      name: minimum-requirements
      title: Moderate Impact — minimum requirements
      props:
      - name: impact-level
        value: moderate
      prose: 'Part One: - All Part Two: - 5.2.1, 5.2.2, 5.2.3, 5.2.4, 5.2.7, 5.2.8, 5.2.9, and 5.2.10
        *Without 5.2.5'
    - id: th-cscs-certification.moderate.csc
      name: certification
      title: Moderate Impact — Cloud Service Customer
      props:
      - name: impact-level
        value: moderate
      - name: party
        value: csc
      prose: Certified by the regulators (Attestation) or certified by a certify body on a 3-year cycle.
        This includes a full certification in the 1st year and a surveillance audit in the 2nd and 3rd
        years.
    - id: th-cscs-certification.moderate.csp
      name: certification
      title: Moderate Impact — Cloud Service Provider
      props:
      - name: impact-level
        value: moderate
      - name: party
        value: csp
      prose: Certified by a certify body on a 3-year cycle. This includes a full certification in the
        1st year and a surveillance audit in the 2nd and 3rd years. Additionally, it must also be certified
        at least to CSA STAR Level 2/CCM and ISO/IEC 27701.
    - id: th-cscs-certification.high.minimum-requirements
      name: minimum-requirements
      title: High Impact — minimum requirements
      props:
      - name: impact-level
        value: high
      prose: 'Part One: - All Part Two: - All'
    - id: th-cscs-certification.high.csc
      name: certification
      title: High Impact — Cloud Service Customer
      props:
      - name: impact-level
        value: high
      - name: party
        value: csc
      prose: Certified by a certify body on a 3-year cycle. This includes a full certification in the
        1st year and a surveillance audit in the 2nd and 3rd years
    - id: th-cscs-certification.high.csp
      name: certification
      title: High Impact — Cloud Service Provider
      props:
      - name: impact-level
        value: high
      - name: party
        value: csp
      prose: Certified by a certify body on a 3-year cycle. This includes a full certification in the
        1st year and a surveillance audit in the 2nd and 3rd years. Additionally, it must also be certified
        to either ISO/IEC 27017 or CSA STAR Level 2/CCM, and ISO/IEC 27018 and ISO/IEC 27701.
  - id: th-cscs-part-one
    class: standard-part
    title: 'Part One: Cloud Security Governance'
    props:
    - name: label
      value: '5.1'
    - name: standard-part
      value: one
    groups:
    - id: th-cscs-5.1.1
      class: section
      title: Information Security Policies
      props:
      - name: label
        value: 5.1.1
      - name: standard-part
        value: one
      - name: minimum-impact-level
        value: low
      controls:
      - id: th-cscs-5.1.1-csp
        class: cscs-requirement
        title: Information Security Policies (Cloud Service Provider)
        props:
        - name: label
          value: 5.1.1
        - name: clause
          value: 5.1.1
        - name: section
          value: 5.1.1
        - name: standard-part
          value: one
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '8'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.1.1-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.1.1-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: 'The cloud service provider shall augment its information security policy to address
              the provision and use of its cloud services, taking the following into account:


              - the baseline information security requirements applicable to the design and implementation
              of the cloud service;


              - risks from authorized insiders;


              - multi-tenancy and cloud service customer isolation (including virtualization);


              - access to cloud service customer assets by staff of the cloud service provider;


              - access control procedures, e.g., strong authentication for administrative access to cloud
              services;


              - communications to cloud service customers during change management;


              - virtualization security;


              - access to and protection of cloud service customer data;


              - lifecycle management of cloud service customer accounts;


              - communication of breaches and information sharing guidelines to aid investigations and
              forensics.'
    - id: th-cscs-5.1.2
      class: section
      title: Organization of Information Security
      props:
      - name: label
        value: 5.1.2
      - name: standard-part
        value: one
      - name: minimum-impact-level
        value: low
      controls:
      - id: th-cscs-5.1.2.1-csp
        class: cscs-requirement
        title: Information Security Roles and Responsibilities (Cloud Service Provider)
        props:
        - name: label
          value: 5.1.2.1
        - name: clause
          value: 5.1.2.1
        - name: section
          value: 5.1.2
        - name: standard-part
          value: one
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '9'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.1.2.1-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.1.2.1-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall agree and document an appropriate allocation of information
              security roles and responsibilities with its cloud service customers, its cloud service
              providers, and its suppliers.
          - id: th-cscs-5.1.2.1-csp_smt.b
            name: item
            props:
            - name: label
              value: b)
            prose: The cloud service provider shall appoint a Data Protection Officer to act as the liaison
              with the cloud service customer.
      - id: th-cscs-5.1.2.2-csp
        class: cscs-requirement
        title: Contact with Authorities (Cloud Service Provider)
        props:
        - name: label
          value: 5.1.2.2
        - name: clause
          value: 5.1.2.2
        - name: section
          value: 5.1.2
        - name: standard-part
          value: one
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '10'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.1.2.2-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.1.2.2-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall inform the cloud service customer of the geographical
              locations of the cloud service provider's organization and the countries where the cloud
              service provider can store the cloud service customer data.
    - id: th-cscs-5.1.3
      class: section
      title: Compliance
      props:
      - name: label
        value: 5.1.3
      - name: standard-part
        value: one
      - name: minimum-impact-level
        value: moderate
      controls:
      - id: th-cscs-5.1.3.1-csp
        class: cscs-requirement
        title: Identification of Applicable Legislation and Contractual Requirements (Cloud Service Provider)
        props:
        - name: label
          value: 5.1.3.1
        - name: clause
          value: 5.1.3.1
        - name: section
          value: 5.1.3
        - name: standard-part
          value: one
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '10'
        - name: minimum-impact-level
          value: moderate
        parts:
        - id: th-cscs-5.1.3.1-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.1.3.1-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall inform the cloud service customer of the legal jurisdictions
              governing the cloud service.
          - id: th-cscs-5.1.3.1-csp_smt.b
            name: item
            props:
            - name: label
              value: b)
            prose: The cloud service provider shall identify its own relevant legal requirements (e.g.,
              regarding encryption to protect personal data) This information shall also be provided to
              the cloud service customer when requested.
          - id: th-cscs-5.1.3.1-csp_smt.c
            name: item
            props:
            - name: label
              value: c)
            prose: The cloud service provider shall provide the cloud service customer with evidence of
              its current compliance with applicable legislation and contractual requirements.
      - id: th-cscs-5.1.3.2-csp
        class: cscs-requirement
        title: Intellectual Property Rights (Cloud Service Provider)
        props:
        - name: label
          value: 5.1.3.2
        - name: clause
          value: 5.1.3.2
        - name: section
          value: 5.1.3
        - name: standard-part
          value: one
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '10'
        - name: minimum-impact-level
          value: moderate
        parts:
        - id: th-cscs-5.1.3.2-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.1.3.2-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall establish a process for responding to intellectual
              property rights complaints.
      - id: th-cscs-5.1.3.3-csp
        class: cscs-requirement
        title: Protection of Records (Cloud Service Provider)
        props:
        - name: label
          value: 5.1.3.3
        - name: clause
          value: 5.1.3.3
        - name: section
          value: 5.1.3
        - name: standard-part
          value: one
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '11'
        - name: minimum-impact-level
          value: moderate
        parts:
        - id: th-cscs-5.1.3.3-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.1.3.3-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall provide information to the cloud service customer
              about the protection of records that are gathered and stored by the cloud service provider
              relating to the use of cloud services by the cloud service customer.
      - id: th-cscs-5.1.3.4-csp
        class: cscs-requirement
        title: Regulation of Cryptographic Controls (Cloud Service Provider)
        props:
        - name: label
          value: 5.1.3.4
        - name: clause
          value: 5.1.3.4
        - name: section
          value: 5.1.3
        - name: standard-part
          value: one
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '11'
        - name: minimum-impact-level
          value: moderate
        parts:
        - id: th-cscs-5.1.3.4-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.1.3.4-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall provide descriptions of the cryptographic controls
              implemented by the cloud service provider to the cloud service customer for reviewing compliance
              with applicable agreements, legislation and regulations.
      - id: th-cscs-5.1.3.5-csp
        class: cscs-requirement
        title: Independent Review of Information Security (Cloud Service Provider)
        props:
        - name: label
          value: 5.1.3.5
        - name: clause
          value: 5.1.3.5
        - name: section
          value: 5.1.3
        - name: standard-part
          value: one
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '11'
        - name: minimum-impact-level
          value: moderate
        parts:
        - id: th-cscs-5.1.3.5-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.1.3.5-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall provide documented evidence to the cloud service customer
              to confirm the cloud service provider’s claims of implementing controls for information
              security and personal data protection.
          - id: th-cscs-5.1.3.5-csp_smt.b
            name: item
            props:
            - name: label
              value: b)
            prose: Where individual cloud service customer audits are impractical or can increase risks
              to information security, the cloud service provider shall provide independent evidence that
              information security and personal data protection are implemented and operated in accordance
              with the cloud service provider's policies and procedures. This shall be made available
              to prospective cloud service customers prior to entering a contract. A relevant independent
              audit as selected by the cloud service provider should normally be an acceptable method
              for fulfilling the cloud service customer's interest in reviewing the cloud service provider's
              operations, provided sufficient transparency is provided. When the independent audit is
              impractical, the cloud service provider should conduct a self-assessment, and disclose its
              process and results to the cloud service customer.
  - id: th-cscs-part-two
    class: standard-part
    title: 'Part Two: Cloud Infrastructure Security and Operation'
    props:
    - name: label
      value: '5.2'
    - name: standard-part
      value: two
    groups:
    - id: th-cscs-5.2.1
      class: section
      title: Human Resource Security
      props:
      - name: label
        value: 5.2.1
      - name: standard-part
        value: two
      - name: minimum-impact-level
        value: low
      controls:
      - id: th-cscs-5.2.1.1-csp
        class: cscs-requirement
        title: Information Security Awareness, Education and Training (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.1.1
        - name: clause
          value: 5.2.1.1
        - name: section
          value: 5.2.1
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '12'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.2.1.1-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.1.1-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall provide awareness, education and training of information
              security and personal data protection, and request contractors to do the same, concerning
              the appropriate handling of cloud service customer data and cloud service derived data.
              This data can contain information confidential to a cloud service customer or be subject
              to specific limitations, including regulatory restrictions, on access and use by the cloud
              service provider.
    - id: th-cscs-5.2.2
      class: section
      title: Asset Management
      props:
      - name: label
        value: 5.2.2
      - name: standard-part
        value: two
      - name: minimum-impact-level
        value: low
      controls:
      - id: th-cscs-5.2.2.1-csp
        class: cscs-requirement
        title: Inventory of Assets (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.2.1
        - name: clause
          value: 5.2.2.1
        - name: section
          value: 5.2.2
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '13'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.2.2.1-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.2.1-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: 'The inventory of assets of the cloud service provider shall explicitly identify:


              - cloud service customer data;


              - cloud service derived data.'
      - id: th-cscs-5.2.2.2-csp
        class: cscs-requirement
        title: Labelling of Information (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.2.2
        - name: clause
          value: 5.2.2.2
        - name: section
          value: 5.2.2
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '13'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.2.2.2-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.2.2-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall document and disclose any service functionality it
              provides allowing cloud service customers to classify and label their information and associated
              assets.
    - id: th-cscs-5.2.3
      class: section
      title: Access Control
      props:
      - name: label
        value: 5.2.3
      - name: standard-part
        value: two
      - name: minimum-impact-level
        value: low
      controls:
      - id: th-cscs-5.2.3.2-csp
        class: cscs-requirement
        title: User Registration and Deregistration (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.3.2
        - name: clause
          value: 5.2.3.2
        - name: section
          value: 5.2.3
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '13'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.2.3.2-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.3.2-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: To manage access to cloud services by a cloud service customer's cloud service users,
              the cloud service provider shall provide user registration and deregistration functions,
              and specifications for the use of these functions to the cloud service customer.
      - id: th-cscs-5.2.3.3-csp
        class: cscs-requirement
        title: User Access Provisioning (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.3.3
        - name: clause
          value: 5.2.3.3
        - name: section
          value: 5.2.3
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '14'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.2.3.3-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.3.3-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall provide functions for managing the access rights of
              the cloud service customer's cloud service users, and specifications for the use of these
              functions.
      - id: th-cscs-5.2.3.4-csp
        class: cscs-requirement
        title: Management of Privileged Access Rights (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.3.4
        - name: clause
          value: 5.2.3.4
        - name: section
          value: 5.2.3
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '14'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.2.3.4-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.3.4-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall provide sufficient authentication techniques (e.g.,
              multi-factor authentication) for authenticating the cloud service administrators of the
              cloud service customer to the administrative capabilities of a cloud service, according
              to the identified risks.
      - id: th-cscs-5.2.3.5-csp
        class: cscs-requirement
        title: Management of Secret Authentication Information of Users (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.3.5
        - name: clause
          value: 5.2.3.5
        - name: section
          value: 5.2.3
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '14'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.2.3.5-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.3.5-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall provide information on procedures for the management
              of the secret authentication information of the cloud service customer, including the procedures
              for allocating such information and for user authentication.
      - id: th-cscs-5.2.3.6-csp
        class: cscs-requirement
        title: Information Access Restriction (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.3.6
        - name: clause
          value: 5.2.3.6
        - name: section
          value: 5.2.3
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '14'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.2.3.6-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.3.6-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall provide access controls that allow the cloud service
              customer to restrict access to its cloud services and the cloud service customer data maintained
              in the service.
      - id: th-cscs-5.2.3.7-csp
        class: cscs-requirement
        title: Use of Privilege Utility Programs (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.3.7
        - name: clause
          value: 5.2.3.7
        - name: section
          value: 5.2.3
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '15'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.2.3.7-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.3.7-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall identify the requirements for any utility programs
              used within the cloud service. The cloud service provider shall ensure that any use of utility
              programs capable of bypassing normal operating or security procedures is strictly limited
              to authorized personnel, and that the use of such programs is reviewed and audited regularly.
      - id: th-cscs-5.2.3.8-csp
        class: cscs-requirement
        title: Secure Log-on Procedures (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.3.8
        - name: clause
          value: 5.2.3.8
        - name: section
          value: 5.2.3
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '15'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.2.3.8-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.3.8-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: Where required, the cloud service provider shall provide secure log-on procedures for
              any account requested by the cloud service customer for cloud service users under the cloud
              service customer's control.
    - id: th-cscs-5.2.4
      class: section
      title: Cryptography
      props:
      - name: label
        value: 5.2.4
      - name: standard-part
        value: two
      - name: minimum-impact-level
        value: low
      controls:
      - id: th-cscs-5.2.4.1-csp
        class: cscs-requirement
        title: Policy on the Use of Cryptographic Controls (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.4.1
        - name: clause
          value: 5.2.4.1
        - name: section
          value: 5.2.4
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '15'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.2.4.1-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.4.1-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall provide information to the cloud service customer
              regarding the encryption used to protect the information and personal data its processes.
              The cloud service provider shall also provide information to the cloud service customer
              about any capabilities it provides that can assist the cloud service customer in applying
              its own cryptographic protection.
    - id: th-cscs-5.2.5
      class: section
      title: Physical and Environment Security
      props:
      - name: label
        value: 5.2.5
      - name: standard-part
        value: two
      - name: minimum-impact-level
        value: high
      controls:
      - id: th-cscs-5.2.5.1-csp
        class: cscs-requirement
        title: Data Center Location (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.5.1
        - name: clause
          value: 5.2.5.1
        - name: section
          value: 5.2.5
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '17'
        - name: minimum-impact-level
          value: high
        parts:
        - id: th-cscs-5.2.5.1-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.5.1-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The primary data centers shall be located in Thailand.
          - id: th-cscs-5.2.5.1-csp_smt.b
            name: item
            props:
            - name: label
              value: b)
            prose: The cloud service provider shall establish a secondary (backup) data centers either
              in Thailand or within the Southeast Asia region as geographically close as practicable to
              the cloud service customer’s primary operations, including Singapore and the Hong Kong Special
              Administrative Region of the People's Republic of China.
      - id: th-cscs-5.2.5.2-csp
        class: cscs-requirement
        title: Secure Disposal of Reuse of Equipment (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.5.2
        - name: clause
          value: 5.2.5.2
        - name: section
          value: 5.2.5
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '17'
        - name: minimum-impact-level
          value: high
        parts:
        - id: th-cscs-5.2.5.2-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.5.2-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service shall ensure that arrangements are made for the secure disposal or
              reuse of resources (e.g., equipment, data storage, files, memory) in a timely manner.
          - id: th-cscs-5.2.5.2-csp_smt.b
            name: item
            props:
            - name: label
              value: b)
            prose: For the purposes of secure disposal or re- use, equipment containing storage media
              that can possibly contain personal data shall be treated as though it does, and shall be
              securely disposed of or prepared for re- use in such a manner that the data cannot be recovered.
    - id: th-cscs-5.2.6
      class: section
      title: Operations Security
      props:
      - name: label
        value: 5.2.6
      - name: standard-part
        value: two
      - name: minimum-impact-level
        value: high
      controls:
      - id: th-cscs-5.2.6.1-csp
        class: cscs-requirement
        title: Change Management (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.6.1
        - name: clause
          value: 5.2.6.1
        - name: section
          value: 5.2.6
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '18'
        - name: minimum-impact-level
          value: high
        parts:
        - id: th-cscs-5.2.6.1-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.6.1-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: 'The cloud service provider shall provide the cloud service customer with information
              regarding changes to the cloud service that could adversely affect the cloud service. The
              following will help the cloud service customer determine the effect the changes can have
              on information security:


              - categories of changes;


              - planned date and time of the changes;


              - technical description of the changes to the cloud service and underlying systems;


              - notification of the start and the completion of the changes.'
          - id: th-cscs-5.2.6.1-csp_smt.b
            name: item
            props:
            - name: label
              value: b)
            prose: When a cloud service provider offers a cloud service that depends on a peer cloud service
              provider, then the cloud service provider might need to inform the cloud service customer
              of changes caused by the peer cloud service provider.
      - id: th-cscs-5.2.6.2-csp
        class: cscs-requirement
        title: Capacity Management (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.6.2
        - name: clause
          value: 5.2.6.2
        - name: section
          value: 5.2.6
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '18'
        - name: minimum-impact-level
          value: high
        parts:
        - id: th-cscs-5.2.6.2-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.6.2-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall monitor the total resource capacity to prevent information
              security incidents caused by resource shortages.
      - id: th-cscs-5.2.6.3-csp
        class: cscs-requirement
        title: Information Backup (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.6.3
        - name: clause
          value: 5.2.6.3
        - name: section
          value: 5.2.6
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '19'
        - name: minimum-impact-level
          value: high
        parts:
        - id: th-cscs-5.2.6.3-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.6.3-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: 'The cloud service provider shall provide the specifications of its backup capabilities
              to the cloud service customer. The specifications should include the following information,
              as appropriate:


              - scope and schedule of backups;


              - backup methods and data formats, including encryption, if relevant;


              - retention periods for backup data;


              - procedures for verifying integrity of backup data;


              - procedures and timescales involved in restoring data from backup;


              - procedures to test the backup capabilities;


              - storage location of backups.'
          - id: th-cscs-5.2.6.3-csp_smt.b
            name: item
            props:
            - name: label
              value: b)
            prose: The cloud service provider shall provide secure and segregated access to backups, if
              such service is offered to cloud service customers.
      - id: th-cscs-5.2.6.4-csp
        class: cscs-requirement
        title: Event Logging (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.6.4
        - name: clause
          value: 5.2.6.4
        - name: section
          value: 5.2.6
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '19'
        - name: minimum-impact-level
          value: high
        parts:
        - id: th-cscs-5.2.6.4-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.6.4-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall provide logging capabilities to the cloud service
              customer.
          - id: th-cscs-5.2.6.4-csp_smt.b
            name: item
            props:
            - name: label
              value: b)
            prose: Where applicable, event logs should record whether personal data has been altered (i.e.
              added, modified or deleted) as a result of the event, and identify the individual responsible
              (audit log). Where multiple cloud service providers are involved in delivering services
              within the reference cloud architecture, roles and responsibilities for meeting this requirement
              should be defined and may be shared.
      - id: th-cscs-5.2.6.5-csp
        class: cscs-requirement
        title: Protection of Log Information (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.6.5
        - name: clause
          value: 5.2.6.5
        - name: section
          value: 5.2.6
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '20'
        - name: minimum-impact-level
          value: high
        parts:
        - id: th-cscs-5.2.6.5-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.6.5-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: Log information recorded for purposes such as security monitoring and operational diagnostics
              can contain personal data. Measures, such as controlling access, shall be put in place to
              ensure that logged information is only used for its intended purposes.
          - id: th-cscs-5.2.6.5-csp_smt.b
            name: item
            props:
            - name: label
              value: b)
            prose: A procedure, preferably automatic, shall be put in place to ensure that logged information
              is deleted within a specified retention and documented period.
      - id: th-cscs-5.2.6.7-csp
        class: cscs-requirement
        title: Clock Synchronization (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.6.7
        - name: clause
          value: 5.2.6.7
        - name: section
          value: 5.2.6
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '20'
        - name: minimum-impact-level
          value: high
        parts:
        - id: th-cscs-5.2.6.7-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.6.7-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall provide information to the cloud service customer
              regarding the clock used by the cloud service provider's systems, and information about
              how the cloud service customer can synchronize local clocks with the cloud service clock.
      - id: th-cscs-5.2.6.8-csp
        class: cscs-requirement
        title: Management of Technical Vulnerabilities (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.6.8
        - name: clause
          value: 5.2.6.8
        - name: section
          value: 5.2.6
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '21'
        - name: minimum-impact-level
          value: high
        parts:
        - id: th-cscs-5.2.6.8-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.6.8-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider should make available to the cloud service customer information
              about the management of technical vulnerabilities that can affect the cloud services provided.
      - id: th-cscs-5.2.6.9-csp
        class: cscs-requirement
        title: Separation of Development, Testing and Operational Environments (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.6.9
        - name: clause
          value: 5.2.6.9
        - name: section
          value: 5.2.6
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '21'
        - name: minimum-impact-level
          value: high
        parts:
        - id: th-cscs-5.2.6.9-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.6.9-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: Where the use of personal data for testing purposes cannot be avoided, a risk assessment
              shall be undertaken. Technical and organizational measures shall be implemented to minimize
              the identified risks.
    - id: th-cscs-5.2.7
      class: section
      title: Communication Security
      props:
      - name: label
        value: 5.2.7
      - name: standard-part
        value: two
      - name: minimum-impact-level
        value: moderate
      controls:
      - id: th-cscs-5.2.7.1-csp
        class: cscs-requirement
        title: Information Transfer Policies and Procedures (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.7.1
        - name: clause
          value: 5.2.7.1
        - name: section
          value: 5.2.7
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '21'
        - name: minimum-impact-level
          value: moderate
        parts:
        - id: th-cscs-5.2.7.1-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.7.1-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: Whenever physical media are used for information transfer, a system shall be put in
              place to record incoming and outgoing physical media containing personal data, including
              the type of physical media, the authorized sender/recipients, the date and time, and the
              number of physical media.
          - id: th-cscs-5.2.7.1-csp_smt.b
            name: item
            props:
            - name: label
              value: b)
            prose: Where possible, cloud service customers shall be requested to put additional measures
              in place (such as encryption) to ensure that the data can only be accessed at the point
              of destination and not in transit.
      - id: th-cscs-5.2.7.2-csp
        class: cscs-requirement
        title: Segregation of Networks (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.7.2
        - name: clause
          value: 5.2.7.2
        - name: section
          value: 5.2.7
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '22'
        - name: minimum-impact-level
          value: moderate
        parts:
        - id: th-cscs-5.2.7.2-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.7.2-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: 'The cloud service provider shall enforce segregation of network access for the following
              cases:


              - segregation between tenants in a multi- tenant environment;


              - segregation between the cloud service provider''s internal administration environment
              and the cloud service customer''s cloud computing environment.'
          - id: th-cscs-5.2.7.2-csp_smt.b
            name: item
            props:
            - name: label
              value: b)
            prose: Where appropriate, the cloud service provider shall help the cloud service customer
              verify the segregation implemented by the cloud service provider.
    - id: th-cscs-5.2.8
      class: section
      title: System Acquisition, Development, and Maintenance
      props:
      - name: label
        value: 5.2.8
      - name: standard-part
        value: two
      - name: minimum-impact-level
        value: low
      controls:
      - id: th-cscs-5.2.8.1-csp
        class: cscs-requirement
        title: Information Security Requirements Analysis and Specification (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.8.1
        - name: clause
          value: 5.2.8.1
        - name: section
          value: 5.2.8
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '22'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.2.8.1-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.8.1-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider shall provide information to the cloud service customers
              about the information security capabilities they use. This information shall be informative
              without disclosing information that could be useful to someone with malicious intent.
      - id: th-cscs-5.2.8.2-csp
        class: cscs-requirement
        title: Secure Development Policy (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.8.2
        - name: clause
          value: 5.2.8.2
        - name: section
          value: 5.2.8
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '22'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.2.8.2-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.8.2-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: The cloud service provider must provide information about its use of secure development
              procedures and practices to the extent compatible with its policy for disclosure.
    - id: th-cscs-5.2.9
      class: section
      title: Supplier Relationships
      props:
      - name: label
        value: 5.2.9
      - name: standard-part
        value: two
      - name: minimum-impact-level
        value: low
      controls:
      - id: th-cscs-5.2.9.2-csp
        class: cscs-requirement
        title: Addressing Security within Supplier Agreements (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.9.2
        - name: clause
          value: 5.2.9.2
        - name: section
          value: 5.2.9
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '23'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.2.9.2-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.9.2-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: 'The cloud service provider shall specify as part of an agreement the relevant information
              security measures that the cloud service provider will implement to ensure no misunderstanding
              between the cloud service provider and cloud service customer. These may include the following
              processes:


              - malware protection;


              - backup;


              - cryptographic controls;


              - vulnerability management;


              - incident management;


              - technical compliance checking;


              - security testing;


              - auditing;


              - collection, maintenance and protection of evidence, including logs and audit trails;


              - protection of information upon termination of the service agreement;


              - authentication and access control;


              - identity and access management.'
          - id: th-cscs-5.2.9.2-csp_smt.b
            name: item
            props:
            - name: label
              value: b)
            prose: The relevant information security measures that the cloud service provider will implement
              can vary based on the type of cloud service the cloud service customer is using.
      - id: th-cscs-5.2.9.3-csp
        class: cscs-requirement
        title: Information and Communication Technology Supply Chain (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.9.3
        - name: clause
          value: 5.2.9.3
        - name: section
          value: 5.2.9
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '24'
        - name: minimum-impact-level
          value: low
        parts:
        - id: th-cscs-5.2.9.3-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.9.3-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: If a cloud service provider uses cloud services of peer cloud service providers, the
              cloud service provider shall ensure information security levels to its own cloud service
              customers are maintained or exceeded.
          - id: th-cscs-5.2.9.3-csp_smt.b
            name: item
            props:
            - name: label
              value: b)
            prose: When the cloud service provider provides cloud services based on a supply chain, the
              cloud service provider shall provide information security objectives to suppliers, and request
              each of the suppliers to perform risk management activities to achieve the objectives.
    - id: th-cscs-5.2.10
      class: section
      title: Information Security Incident Management
      props:
      - name: label
        value: 5.2.10
      - name: standard-part
        value: two
      - name: minimum-impact-level
        value: moderate
      controls:
      - id: th-cscs-5.2.10.1-csp
        class: cscs-requirement
        title: Responsibilities and Procedures (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.10.1
        - name: clause
          value: 5.2.10.1
        - name: section
          value: 5.2.10
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '24'
        - name: minimum-impact-level
          value: moderate
        parts:
        - id: th-cscs-5.2.10.1-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.10.1-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: As a part of the service specifications, the cloud service provider shall define the
              allocation of information security incident management responsibilities and procedures between
              the cloud service customer and the cloud service provider.
          - id: th-cscs-5.2.10.1-csp_smt.b
            name: item
            props:
            - name: label
              value: b)
            prose: 'The cloud service provider shall provide the cloud service customer with documentation
              covering:


              - the scope of information security incidents that the cloud service provider will report
              to the cloud service customer;


              - the level of disclosure of the detection of information security incidents and the associated
              responses;


              - the target timeframe in which notifications of information security incidents will occur;


              - the procedure for the notification of information security incidents;


              - contact information for the handling of issues relating to information security incidents;


              - any remedies that can apply if certain information security incidents occur.'
          - id: th-cscs-5.2.10.1-csp_smt.c
            name: item
            props:
            - name: label
              value: c)
            prose: An information security incident shall trigger a review by the cloud service customer,
              or jointly between the cloud service customer and the cloud service provider, as part of
              their information security incident management process, to determine whether a personal
              data breach has occurred.
      - id: th-cscs-5.2.10.2-csp
        class: cscs-requirement
        title: Reporting Information Security Events (Cloud Service Provider)
        props:
        - name: label
          value: 5.2.10.2
        - name: clause
          value: 5.2.10.2
        - name: section
          value: 5.2.10
        - name: standard-part
          value: two
        - name: party
          value: csp
        - name: party-title
          value: Cloud Service Provider
        - name: source-page
          value: '25'
        - name: minimum-impact-level
          value: moderate
        parts:
        - id: th-cscs-5.2.10.2-csp_smt
          name: statement
          parts:
          - id: th-cscs-5.2.10.2-csp_smt.a
            name: item
            props:
            - name: label
              value: a)
            prose: 'The cloud service provider shall provide mechanisms for:


              - the cloud service customer to report an information security event to the cloud service
              provider;


              - the cloud service provider to report an information security event to a cloud service
              customer;


              - the cloud service customer to track the status of a reported information security event.'
